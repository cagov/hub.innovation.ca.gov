# Dependabot security updates run whether or not this file exists. What this
# adds is scheduled version updates, batched so routine upgrades arrive as a
# few reviewable pull requests each week instead of one per package.
#
# Major-version bumps are deliberately left out of the groups so they land as
# individual pull requests and get looked at on their own.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    ignore:
      # @cagov/ds-page-navigation 2.2.3 moved build and test tooling
      # (@cagov/11ty-build-system, @web/dev-server, @web/test-runner) into its
      # production dependencies, which drags in a vulnerable axios chain. Its
      # only change over 2.2.2 is CSS for <aside> containers, and this site
      # wraps cagov-page-navigation in <sidebar> everywhere, so there is
      # nothing to gain. cagov/design-system is archived, so 2.2.3 is the final
      # release and this will not be fixed upstream.
      - dependency-name: '@cagov/ds-page-navigation'
        versions:
          - '2.2.3'
    groups:
      # Build and lint tooling: one pull request for all minor/patch upgrades.
      dev-tooling:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      # Dependencies that shape the built site move more carefully, so only
      # patch releases are batched here.
      site-patches:
        applies-to: version-updates
        dependency-type: production
        patterns:
          - '*'
        update-types:
          - patch

  # Keep the workflow actions current. Note that actions pinned to a moving ref
  # (for example @master) cannot be updated by Dependabot.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
